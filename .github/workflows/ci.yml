name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/punto_venta?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Crear el esquema de la base de datos de pruebas
        run: mysql -h 127.0.0.1 -uroot -proot < db/schema.sql
      - name: Instalar un servidor gráfico virtual (para las pruebas de la interfaz Swing)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Compilar y ejecutar todas las pruebas (unitarias, integración, interfaz y regresión)
        run: xvfb-run -a mvn -B verify
